// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Needed for the vendored io.github.d4viddf.hyperisland_kit sources
        // (android/app/src/main/java/io/github/d4viddf/hyperisland_kit) --
        // see that dir's own LICENSE-hyperisland-kit.txt (Apache 2.0). Not
        // published to Maven Central or a working Jitpack build as of
        // 2026-09-18, so the source is vendored directly rather than pulled
        // as a normal dependency.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
        classpath 'org.jetbrains.kotlin:kotlin-serialization:1.9.24'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
